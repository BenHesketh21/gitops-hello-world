apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: deploy-api-pipeline
  namespace: argo
spec:
  arguments:
    parameters:
    - name: repo-url
      value: ""
    - name: base-branch
      value: main
    - name: output-branch
      value: promotions
    - name: chart-path
      value: chart
    - name: values-file
      value: values.yaml
    - name: release-name
      value: api
    - name: app-name
      value: api
    - name: commit-message
      value: "Promote API via Argo Workflows"
  parameters:
  - name: repo-url
    description: "Git repository URL containing the Helm chart and values file"
  - name: base-branch
    description: "Branch to clone for rendering the Helm chart"
    value: main
  - name: output-branch
    description: "Branch to push the rendered manifests for Argo CD"
    value: promotions
  - name: chart-path
    description: "Path to the Helm chart within the repository"
    value: chart
  - name: values-file
    description: "Path to the Helm values file within the repository"
    value: values.yaml
  - name: release-name
    description: "Name of the Helm release"
    value: api
  - name: app-name
    description: "Name of the Argo CD application to sync"
    value: api
  - name: commit-message
    description: "Commit message for the changes pushed to the output branch"
    value: "Promote API via Argo Workflows" 
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi
  templates:
  - name: deploy-api-pipeline
    inputs:
      parameters:
      - name: repo-url
      - name: base-branch
        value: main
      - name: output-branch
        value: promotions
      - name: chart-path
        value: charts/app1
      - name: values-file
        value: values.yaml
      - name: release-name
        value: api
      - name: app-name
        value: api
      - name: commit-message
        value: "Promote API via Argo Workflows"
    steps:
    - - name: clone
        templateRef:
          name: gitops-common-templates
          template: git-clone-ensure-branch
        arguments:
          parameters:
          - name: repo-url
            value: "{{inputs.parameters.repo-url}}"
          - name: branch
            value: "{{inputs.parameters.output-branch}}"
          - name: dest
            value: "/work"
    - - name: render-helm
        templateRef:
          name: gitops-common-templates
          template: helm-template-to-file
        arguments:
          parameters:
          - name: chart-path
            value: "/work/{{inputs.parameters.chart-path}}"
          - name: values-file
            value: "/work/{{inputs.parameters.values-file}}"
          - name: output-file
            value: "/work/rendered.yaml"
          - name: release-name
            value: "{{inputs.parameters.release-name}}"
    - - name: commit-and-push
        templateRef:
          name: gitops-common-templates
          template: git-commit-push
        arguments:
          parameters:
          - name: repo-path
            value: "/work"
          - name: branch
            value: "{{inputs.parameters.output-branch}}"
          - name: commit-message
            value: "{{inputs.parameters.commit-message}}"
    # - - name: argocd-sync
    #     templateRef:
    #       name: gitops-common-templates
    #       template: argocd-sync-wait
    #     arguments:
    #       parameters:
    #       - name: app-name
    #         value: "{{inputs.parameters.app-name}}"
    #       - name: timeout
    #         value: "300"

  volumes:
  - name: git-ssh
    secret:
      secretName: github-ssh-key
      defaultMode: 0600
