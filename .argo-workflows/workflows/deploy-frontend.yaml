apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: deploy-frontend-
  namespace: argo
spec:
  entrypoint: main
  volumeClaimTemplates:
    - metadata:
        name: dev
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi
    - metadata:
        name: prod
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi
  templates:
    - name: main
      dag:
        tasks:
          - name: deploy-dev
            templateRef:
              name: deploy-helm-pipeline
              template: deploy-helm-pipeline
            arguments:
              parameters:
                - name: repo-url
                  value: "https://github.com/BenHesketh21/gitops-hello-world.git"
                - name: base-branch
                  value: "main"
                - name: output-branch
                  value: "env/dev/frontend"
                - name: chart-path
                  value: "chart"
                - name: values-file
                  value: "chart/values/frontend/dev.yaml"
                - name: release-name
                  value: "frontend"
                - name: app-name
                  value: "hello-world-frontend-dev"
                - name: workspace
                  value: dev
          - name: approve-prod
            templateRef:
              name: deploy-helm-pipeline
              template: approve-promotion
            dependencies: ["deploy-dev"]
          - name: deploy-prod
            templateRef:
              name: deploy-helm-pipeline
              template: deploy-helm-pipeline
            arguments:
              parameters:
                - name: repo-url
                  value: "https://github.com/BenHesketh21/gitops-hello-world.git" # <--- update with real repo URL
                - name: base-branch
                  value: "main"
                - name: output-branch
                  value: "env/prod/frontend"
                - name: chart-path
                  value: "chart" # path inside the repo to the Helm chart
                - name: values-file
                  value: "chart/values/frontend/prod.yaml" # path inside repo to values file (adjust as needed)
                - name: release-name
                  value: "frontend"
                - name: app-name
                  value: "hello-world-frontend-prod"
                - name: workspace
                  value: prod
            dependencies: ["approve-prod"]