apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: deploy-api-dev-
  namespace: argo
spec:
  # Use the WorkflowTemplate that contains the reusable pipeline
  workflowTemplateRef:
    name: deploy-api-pipeline
  entrypoint: deploy-api-pipeline
  arguments:
    parameters:
    - name: repo-url
      value: "https://github.com/BenHesketh21/gitops-hello-world.git" # <--- update with real repo URL
    - name: base-branch
      value: "main"
    - name: output-branch
      value: "env/dev/api"
    - name: chart-path
      value: "chart" # path inside the repo to the Helm chart
    - name: values-file
      value: "chart/values/api/dev.yaml" # path inside repo to values file (adjust as needed)
    - name: release-name
      value: "api"
    - name: app-name
      value: "hello-world-api"
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: deploy-api-prod-
  namespace: argo
spec:
  # Use the WorkflowTemplate that contains the reusable pipeline
  workflowTemplateRef:
    name: deploy-helm-pipeline
  entrypoint: deploy-helm-pipeline
  arguments:
    parameters:
    - name: repo-url
      value: "https://github.com/BenHesketh21/gitops-hello-world.git" # <--- update with real repo URL
    - name: base-branch
      value: "main"
    - name: output-branch
      value: "env/prod/api"
    - name: chart-path
      value: "chart" # path inside the repo to the Helm chart
    - name: values-file
      value: "chart/values/api/prod.yaml" # path inside repo to values file (adjust as needed)
    - name: release-name
      value: "api"
    - name: app-name
      value: "hello-world-api"