apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  {{- with .Values.labels }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart.fullname" . | nindent 4 }}
