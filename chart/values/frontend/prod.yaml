environment: prod
serviceName: hello-world-frontend

image:
  registry: ghcr.io/benhesketh21
  repository: gitops-hello-world-frontend
  tag: "0.0.1"

ingress:
  enabled: true
  hosts: 
  - host: hello-world.local
    paths:
    - path: /
      pathType: Prefix

env:
  - name: API_URL
    value: http://hello-world-api-prod:8080