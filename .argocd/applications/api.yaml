api:
  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: hello-world-api
    namespace: argocd
  spec:
    project: default
    source:
      repoURL: 'https://github.com/BenHesketh21/hello-world-gitops.git'
      targetRevision: HEAD
      path: api
    destination:
      server: 'https://kubernetes.default.svc'
      namespace: api
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true